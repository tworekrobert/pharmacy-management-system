name: .NET

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Apteka.sln

      - name: Build
        run: dotnet build Apteka.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Apteka.UnitTests --configuration Release --verbosity normal
